name: Deploy tinvist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Общий лок со всеми проектами — серийные деплои на VPS.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} 'mkdir -p /opt/tinvist'
          # Синхронизируем исходники, СОХРАНЯЯ секреты и рантайм-состояние на VPS.
          rsync -avz --delete \
            --exclude='.git' --exclude='node_modules' --exclude='dist' \
            --exclude='.env' --exclude='data' --exclude='audit' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ root@${{ secrets.VPS_HOST }}:/opt/tinvist/
          # Пересобираем и перезапускаем контейнер.
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} \
            'cd /opt/tinvist && docker compose up -d --build --force-recreate'

      - name: Smoke check
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} '
            sleep 5
            docker ps --filter name=tinvist --format "{{.Names}} {{.Status}}"
            docker logs tinvist --tail 20 2>&1 | grep -q "Планировщик запущен" \
              && echo "✅ loop запущен" || (echo "❌ loop не стартовал" && docker logs tinvist --tail 40 && exit 1)
          '
