name: Deploy tinvist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Общий лок со всеми проектами — серийные деплои на VPS.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  # Гейт: типы + автотесты. Падение блокирует деплой на прод.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} 'mkdir -p /opt/tinvist'
          # Синхронизируем исходники, СОХРАНЯЯ секреты и рантайм-состояние на VPS.
          rsync -avz --delete \
            --exclude='.git' --exclude='node_modules' --exclude='dist' \
            --exclude='.env' --exclude='/data' --exclude='/audit' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ root@${{ secrets.VPS_HOST }}:/opt/tinvist/
          # Пересобираем и перезапускаем контейнер.
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} \
            'cd /opt/tinvist && docker compose up -d --build --force-recreate'

      - name: Smoke check
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} '
            sleep 5
            docker ps --filter name=tinvist --format "{{.Names}} {{.Status}}"
            docker logs tinvist --tail 20 2>&1 | grep -q "Планировщик запущен" \
              && echo "✅ loop запущен" || (echo "❌ loop не стартовал" && docker logs tinvist --tail 40 && exit 1)
          '

      - name: Notify Telegram
        if: success() && env.TG_TOKEN != ''
        env:
          TG_TOKEN: ${{ secrets.TG_DEPLOY_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_DEPLOY_CHAT_ID }}
        run: |
          COMMITS=$(git log --oneline -3 --format="• %s" | head -3)
          MSG="🚀 tinvist deployed"$'\n\n'"${COMMITS}"$'\n'"✅ loop перезапущен на VPS"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" >/dev/null
